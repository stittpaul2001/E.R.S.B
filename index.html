<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E.R.S.B. (Extrmely Realistic Sports Bets)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@latest/css/materialdesignicons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="conatiner-fluid">
    <header class="nav-bar">
      <div class="row">
        <div class="col-md-12 text-start">
          <h1>ERSB</h1>
          <p class="fs-4 text-start">Extremly Realistic Sports Bets</p>
        </div>
      </div>
    </header>
  </div>

  <main class="conatiner-fluid">
    <div class="row align-content-center justify-text-center d-flex">
      <div class="col-md-12 text-center">
        <div class="fs-4 fw-bold">Bank</div>
        <div class="rounded-pill bg-primary text-center">
          <p class="text-end fs-4">$100</p>
        </div>
      </div>
    </div>
    <div class="row justify-items-center align-items-center d-flex">
      <div class="col-md-6">
        <h3>Team #1</h3>
        <div class="rounded-pill bg-dark text-center"></div>
        <button class="rounded-pill btn-one">Bet 5</button>
        <button class="rounded-pill btn-one">Bet 25</button>
        <button class="rounded-pill btn-one">Bet 100</button>
        <button class="rounded-pill btn-one">Bet All</button>
        <div class="col-md-6">
          <h3>Team #2</h3>
          <div class="rounded-pill bg-dark text-center">
          </div>
          <button class="rounded-pill btn-two">Bet 5</button>
          <button class="rounded-pill btn-two">Bet 25</button>
          <button class="rounded-pill btn-two">Bet 100</button>
          <button class="rounded-pill btn-two">Bet All</button>

        </div>

  </main>

  <script src="app.js"></script>
</body>

</html>
