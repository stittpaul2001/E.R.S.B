<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E.R.S.B. (Extrmely Realistic Sports Bets)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@latest/css/materialdesignicons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"
    defer></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="conatiner-fluid">
    <header class="nav-bar border-bottom border-5">
      <div class="row justify-content-start d-inline">
        <div class="col-md-6  d-flex">
          <h1 class="shadow">E.R.S.B.</h1>
          <h1 class="fs-2 shadow">Extremly Realistic Sports Bets</h1>
        </div>
    </header>
  </div>

  <main class="conatiner-fluid p-3">
    <div class="row align-content-center justify-text-center d-flex">
      <div class="col-md-12 text-center">
        <div class="bank-button rounded-pill bg-primary border">
          <div class="fs-1 text-center">Bank:
            <span id="bank">100.00</span>
          </div>
        </div>
      </div>
      <div class="row justify-items-center align-items-center">
        <div class="col-md-6 text-center">
          <h3 class="text-center">Team #1</h3>
          <div class="rounded-pill bg-dark text-center">
            <p class="fs-1 text-center" id="TeamOne"></p>
          </div>
          <button class="rounded-pill btn-one" onclick="betTeam(1,5)">Bet 5</button>
          <button class="rounded-pill btn-one" onclick="betTeam(1,25)">Bet 25</button>
          <button class="rounded-pill btn-one" onclick="betTeam(1,100)">Bet 100</button>
          <button class="rounded-pill btn-one" onclick="betTeam(1,bank)">Bet All</button>
        </div>
        <div class="col-md-6 text-center">
          <h3 class="text-center">Team #2</h3>
          <div class="rounded-pill bg-dark text-center">
            <p class="fs-1 text-center" id="TeamTwo"></p>
          </div>
          <button class="rounded-pill btn-two" onclick="betTeam(1,5)">Bet 5</button>
          <button class="rounded-pill btn-two" onclick="betTeam(1,25)">Bet 25</button>
          <button class="rounded-pill btn-two" onclick="betTeam(1,100)">Bet 100</button>
          <button class="rounded-pill btn-two" onclick="betTeam(1,bank)">Bet All</button>
        </div>
      </div>

  </main>

  <script src="app.js"></script>
</body>

</html>
